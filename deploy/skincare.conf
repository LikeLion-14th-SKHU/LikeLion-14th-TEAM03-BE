upstream skincare {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name api.d-dayskincare.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.d-dayskincare.cloud;

    ssl_certificate /etc/letsencrypt/live/api.d-dayskincare.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.d-dayskincare.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://skincare;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
